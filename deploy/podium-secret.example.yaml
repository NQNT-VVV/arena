# Integration Podium — MODELE, ne jamais commiter les vraies valeurs.
#
# Podium est le hub : comptes, classement Elo, defis hebdo. Arena s'y branche
# par trois valeurs :
#   - PODIUM_URL        : origine publique du hub, ex. https://podium.danwalex.com
#   - PODIUM_GAME_KEY   : cle d'ingestion du jeu, generee dans l'admin Podium
#                         (/admin/jeux, fiche « arena »)
#   - PODIUM_SSO_SECRET : secret partage avec le hub (SSO_SECRET cote Podium),
#                         qui verifie le cookie d'identite des joueurs
#
# Renseigne le secret sans passer par un fichier :
#
#   kubectl -n arena create secret generic podium-integration \
#     --from-literal=PODIUM_URL='https://podium.danwalex.com' \
#     --from-literal=PODIUM_GAME_KEY='la-cle-generee-dans-l-admin' \
#     --from-literal=PODIUM_SSO_SECRET='le-meme-secret-que-le-hub' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl -n arena rollout restart deploy/arena
#
# Le Deployment lit ces cles en `optional: true` : sans le secret, Arena demarre
# normalement et le module Podium reste inerte.
apiVersion: v1
kind: Secret
metadata:
  name: podium-integration
  namespace: arena
type: Opaque
stringData:
  PODIUM_URL: ""
  PODIUM_GAME_KEY: ""
  PODIUM_SSO_SECRET: ""
