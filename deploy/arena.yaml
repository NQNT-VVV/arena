# Arena — deploiement minimal.
#   kubectl create secret generic arena -n arena --from-literal=SESSION_SECRET=$(openssl rand -hex 32)
#   kubectl apply -f deploy/arena.yaml
#
# Difference notable avec Refrain : l'etat n'est pas volatil. Une battle porte
# des fichiers televerses et dure deux heures, donc un volume persistant et une
# seule instance a la fois. `Recreate` plutot que `RollingUpdate` : deux pods
# ecrivant la meme base SQLite se marcheraient dessus.

apiVersion: v1
kind: Namespace
metadata:
  name: arena
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arena-data
  namespace: arena
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena
  namespace: arena
  labels:
    app.kubernetes.io/name: arena
spec:
  replicas: 1
  strategy:
    type: Recreate          # jamais deux instances sur le meme volume
  selector:
    matchLabels:
      app.kubernetes.io/name: arena
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arena
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: arena
          image: ghcr.io/nqnt-vvv/arena:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9464
          env:
            - name: PORT
              value: "3000"
            - name: METRICS_PORT
              value: "9464"
            - name: DATA_DIR
              value: /app/data
            - name: STORAGE_DRIVER
              value: local
            # Obligatoire : le serveur refuse de demarrer sans lui en production.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: arena
                  key: SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # Le transcodage ffmpeg est le poste le plus gourmand : deux jobs
              # en parallele saturent facilement un coeur.
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arena-data
        - name: tmp
          # ffmpeg ecrit ses fichiers intermediaires ici.
          emptyDir:
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: arena
  namespace: arena
  labels:
    app.kubernetes.io/name: arena
spec:
  selector:
    app.kubernetes.io/name: arena
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics          # scrape par Prometheus, jamais expose par l'Ingress
      port: 9464
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arena
  namespace: arena
  annotations:
    # Socket.IO garde des connexions ouvertes toute la session :
    # sans ces delais nginx les coupe au bout de 60 s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "7200"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "7200"
    # Les rendus video peuvent etre lourds : la valeur par defaut de nginx
    # (1 Mo) rejetterait la quasi-totalite des televersements.
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
spec:
  ingressClassName: nginx
  rules:
    - host: arena.danwalex.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arena
                port:
                  name: http
