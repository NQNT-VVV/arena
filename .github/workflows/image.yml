name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # La suite de transcodage travaille avec un vrai ffmpeg : sans lui elle
      # s'ignore d'elle-meme, et on perdrait justement les verifications
      # d'anonymat les plus importantes (metadonnees, coupure, fondu).
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Installer les dependances
        run: npm ci

      - name: Types et syntaxe serveur
        run: |
          npm run typecheck
          for f in server/*.js server/storage/*.js server/integrations/*.js; do node --check "$f"; done

      - name: Suites sans reseau
        run: |
          npm run test:state
          npm run test:mime
          npm run test:scoring

      - name: Build Next
        run: SESSION_SECRET=ci-only npm run build

      # Les suites reseau demarrent le serveur en production : elles ont
      # besoin du build qui precede.
      - name: Suites sur serveur reel
        run: |
          npm run test:assets
          npm run test:submissions
          npm run test:voting
          npm run test:transcode
          npm run test:discord
          npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nqnt-vvv/arena
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
